name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        requirements: [requirements_test.txt, requirements_test_2026_5.txt]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r ${{ matrix.requirements }}
      - run: python -m pytest -q
      - run: python tests/ws_loopback.py
  playback-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - run: dotnet run --project experimental/playback/tests/PlaybackTests.csproj
      - run: dotnet run --project kit/tests/LanApiTests.csproj
