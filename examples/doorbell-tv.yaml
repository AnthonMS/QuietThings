# Copy as a Home Assistant package and replace QUIETTHINGS_ENTRY_ID.
# This file is also the source of the owner's installed example.
# The callback is intentionally explicit: the TV emits a named event, HA acts.
script:
  door_bell_notify_tv:
    alias: "Doorbell: show living room TV notification"
    description: "Live camera while the TV is on, with Unlock Door only when locked."
    mode: restart
    fields:
      notification_kind:
        name: Notification kind
        description: Doorbell by default; person is used by the camera detection automation.
        default: doorbell
        selector:
          select:
            options:
              - doorbell
              - person
    sequence:
      - condition: template
        value_template: >-
          {{ states('media_player.quietthings_living_room') in
             ['on', 'playing', 'paused', 'idle', 'buffering']
             or is_state('media_player.samsung_livingroom', 'on') }}
      - variables:
          tv_person_detected: "{{ (notification_kind | default('doorbell')) == 'person' }}"
          tv_notification_id: "{{ 'person-tv-' if tv_person_detected else 'doorbell-tv-' }}{{ now().strftime('%Y%m%d%H%M%S%f') }}"
          tv_notification_title: "{{ 'Person at the front door' if tv_person_detected else 'Someone at the front door' }}"
          tv_notification_message: "{{ 'A person was detected by the front door camera.' if tv_person_detected else 'The doorbell was pressed.' }}"
          tv_notification_actions: >-
            {{ [{'action': 'UNLOCK_FRONT_DOOR', 'title': 'Unlock Door'}]
               if is_state('lock.front_door', 'locked') else [] }}
      - action: quietthings.notify
        continue_on_error: true
        response_variable: tv_notification_response
        data:
          entry_id: QUIETTHINGS_ENTRY_ID
          id: "{{ tv_notification_id }}"
          title: "{{ tv_notification_title }}"
          message: "{{ tv_notification_message }}"
          camera_entity: camera.front_door
          duration_seconds: 30
          actions: "{{ tv_notification_actions }}"
      # A missing camera should not hide the doorbell notice altogether.
      - if:
          - condition: template
            value_template: >-
              {{ tv_notification_response is not defined or
                 not tv_notification_response.get('displayed', false) }}
        then:
          - action: quietthings.notify
            data:
              entry_id: QUIETTHINGS_ENTRY_ID
              id: "{{ tv_notification_id }}"
              title: "{{ tv_notification_title }}"
              message: "{{ tv_notification_message }} Camera preview is unavailable."
              duration_seconds: 30
              actions: "{{ tv_notification_actions }}"

automation:
  - id: quiet_home_doorbell_tv_notification
    alias: "Quiet Home: doorbell camera notification"
    description: "Physical doorbell single, double and hold presses notify the TV if on."
    mode: restart
    triggers:
      - trigger: event
        event_type: deconz_event
        event_data:
          id: door_bell
    conditions:
      - condition: template
        value_template: "{{ trigger.event.data.get('event') in [1004, 1006, 1001] }}"
    actions:
      - action: script.door_bell_notify_tv

  - id: quiet_home_front_door_person_tv_notification
    alias: "Quiet Home: front door person camera notification"
    description: "Notify an awake TV on a new person detection in the front door zone, day or night."
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.detection_zone_person_occupancy
        from: "off"
        to: "on"
    actions:
      - action: script.door_bell_notify_tv
        data:
          notification_kind: person

  - id: quiet_home_doorbell_tv_unlock_callback
    alias: "Quiet Home: Unlock Door notification action"
    description: "Only a matching live TV doorbell or person notification can request this action."
    mode: single
    triggers:
      - trigger: event
        event_type: quietthings_notification_action
        event_data:
          entry_id: QUIETTHINGS_ENTRY_ID
          action: UNLOCK_FRONT_DOOR
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.event.data.get('notification_id', '').startswith('doorbell-tv-')
             or trigger.event.data.get('notification_id', '').startswith('person-tv-') }}
      - condition: state
        entity_id: lock.front_door
        state: locked
      - condition: template
        value_template: >-
          {{ states('media_player.quietthings_living_room') in
             ['on', 'playing', 'paused', 'idle', 'buffering']
             or is_state('media_player.samsung_livingroom', 'on') }}
    actions:
      - action: lock.unlock
        target:
          entity_id: lock.front_door
